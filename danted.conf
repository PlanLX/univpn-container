# /etc/danted.conf —— SOCKS5 代理
#
# 作用: 宿主机(或别的程序)连容器的 1080 端口, 流量从 DANTE_INTERFACE 指定的
# VPN 网卡出去, 于是不用在宿主机上装 VPN 客户端也能访问内网。
#
# external 那一行会被 danted-start.sh 按环境变量 DANTE_INTERFACE 改掉,
# 这里写的是默认值。

logoutput: /var/log/sockd.log

# 监听容器内所有网卡(靠 compose 的端口映射暴露给宿主机)
internal: 0.0.0.0 port = 1080

# 出口网卡: UniVPN 拨号成功后创建的那张
external: cnem_vnic

# 只有本机能访问到映射出来的端口, 认证就免了
clientmethod: none
socksmethod: none

user.privileged: root
user.unprivileged: root

client pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    log: connect error
}

socks pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    log: connect error
}
