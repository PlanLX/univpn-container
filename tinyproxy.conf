# /etc/tinyproxy/tinyproxy.conf —— HTTP 代理
#
# 给只支持 HTTP 代理的程序用: 它把请求转发给本机的 SOCKS5(Dante), 再由 Dante 送进 VPN。
# 所以链路上真正的出口还是 Dante, 这里的 Upstream 别去掉。

Port 8888
Listen 0.0.0.0

# 容器内的 8888 只通过 compose 端口映射暴露, 这里放开所有来源
Allow 0.0.0.0/0

User root
Group root

Timeout 600

DefaultErrorFile "/usr/share/tinyproxy/default.html"
StatFile "/usr/share/tinyproxy/stats.html"
LogFile "/var/log/tinyproxy.log"
LogLevel Info

# 关键: 转发给容器内的 SOCKS5
Upstream socks5 127.0.0.1:1080

MaxClients 100
ViaProxyName "tinyproxy"
