# supervisor 统一看管四个东西:
#   vnc      虚拟桌面(TigerVNC + fluxbox + 客户端由会话脚本拉起)
#   novnc    网页入口(websockify)
#   danted   SOCKS5 代理, 等 VPN 网卡出现后才启动
#   tinyproxy HTTP 代理, 链到 danted
#
# 客户端进程本身由 Xtigervnc-session 里的 univpn-keeper.sh 负责重启, 不归 supervisor 管
# (这样客户端崩溃时不会连累整个桌面重建)。

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[unix_http_server]
file=/var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:vnc]
command=/usr/local/bin/vnc_startup.sh
user=vpnuser
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/vnc_stdout.log
stderr_logfile=/var/log/supervisor/vnc_stderr.log

[program:novnc]
command=/usr/local/bin/novnc_launch.sh
user=vpnuser
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/novnc_stdout.log
stderr_logfile=/var/log/supervisor/novnc_stderr.log

[program:danted]
command=/usr/local/bin/danted-start.sh
user=root
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/danted_stdout.log
stderr_logfile=/var/log/supervisor/danted_stderr.log

[program:tinyproxy]
# -d: 不做守护进程化。不加的话 tinyproxy 会 fork 到后台、父进程立即退出,
# supervisor 就会报 "exited too quickly", 端口看着是开的但不受管理。
command=/usr/bin/tinyproxy -d -c /etc/tinyproxy/tinyproxy.conf
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/tinyproxy_stdout.log
stderr_logfile=/var/log/supervisor/tinyproxy_stderr.log
